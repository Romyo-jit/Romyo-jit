name: Update transparent WakaTime chart

on:
  schedule:
    - cron: "17 0 * * *" # Daily at 5:47 AM IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wakatime-chart
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install Pillow

      - name: Download and remove background
        shell: python
        run: |
          import io
          import urllib.request
          from pathlib import Path
          from PIL import Image

          url = (
              "https://wakatime.com/share/"
              "@7bd8279d-fa31-4eff-8ddc-ee2da52b3ada/"
              "89ec06c3-6d7d-45cf-935d-cba46482e2e9.png"
          )

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "WakaTime-README"},
          )

          with urllib.request.urlopen(request, timeout=60) as response:
              image = Image.open(io.BytesIO(response.read())).convert("RGBA")

          # Use the top-left pixel as the background color.
          background = image.getpixel((0, 0))[:3]
          tolerance = 12

          pixels = []
          for r, g, b, a in image.getdata():
              difference = max(
                  abs(r - background[0]),
                  abs(g - background[1]),
                  abs(b - background[2]),
              )
              if difference <= tolerance:
                  pixels.append((r, g, b, 0))
              else:
                  pixels.append((r, g, b, a))

          image.putdata(pixels)

          output = Path("assets/wakatime-transparent.png")
          output.parent.mkdir(parents=True, exist_ok=True)
          image.save(output, optimize=True)

          print(f"Saved transparent chart: {image.width} × {image.height}")

      - name: Commit updated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/wakatime-transparent.png

          if git diff --cached --quiet; then
            echo "Chart unchanged."
          else
            git commit -m "Update transparent WakaTime chart"
            git push
          fi
